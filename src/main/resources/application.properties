spring.application.name=jobit

# 앱을 내려도 Postgres 컨테이너를 멈추지 않는다.
# 기본값(start-and-stop)은 bootRun 종료 시 컨테이너까지 내리므로, 재시작할 때마다
# compose.yaml 의 healthcheck(5초 간격)를 다시 기다리게 된다.
# 접속 정보는 여전히 자동 주입된다 — spring.datasource.* 를 직접 쓰지 않는다.
spring.docker.compose.lifecycle-management=start-only

# ─── LLM 지출 방어 (스펙 §6) ─────────────────────────────────────────────
# 두 겹이다. 소유자별 한도는 한 사람의 폭주를, 전역 일일 상한은 총액을 막는다.
# 횟수만 막으면 "많은 사람이 조금씩"을 못 막고, 총액만 막으면 한 사람이 하루 예산을
# 다 태워 다른 사람을 막는다.
#
# 캐시 적중은 소비하지 않는다 — LLM 을 부르지 않으므로 돈이 나가지 않는다.
# 0 으로 두면 해당 방어를 끈다 (로컬 개발용).
jobit.llm.calls-per-hour=20
jobit.llm.daily-budget-usd=5.00
