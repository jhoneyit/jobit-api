spring.application.name=jobit

# 비밀값은 `.env` 에서 읽는다 (.gitignore 대상, 목록은 .env.example).
#
# **Spring Boot 는 .env 를 자동으로 읽지 않는다.** 이 줄이 없으면 파일을 만들어 둬도 조용히
# 무시되고, 호출자 인증이 꺼진 채로 뜬다 — 가장 나쁜 실패 모드다.
#
# `optional:` 이라 파일이 없어도 앱은 뜬다. `[.properties]` 는 확장자 없는 파일을 properties
# 형식으로 읽으라는 뜻이다 (KEY=value 라 형식이 같다).
#
# **OS 환경변수가 이 파일보다 우선한다.** 잠깐 다른 값으로 띄우고 싶으면 export 로 덮으면 된다.
spring.config.import=optional:file:.env[.properties]

# 앱을 내려도 Postgres 컨테이너를 멈추지 않는다.
# 기본값(start-and-stop)은 bootRun 종료 시 컨테이너까지 내리므로, 재시작할 때마다
# compose.yaml 의 healthcheck(5초 간격)를 다시 기다리게 된다.
# 접속 정보는 여전히 자동 주입된다 — spring.datasource.* 를 직접 쓰지 않는다.
spring.docker.compose.lifecycle-management=start-only

# ─── 스키마 검증 ─────────────────────────────────────────────────────────
# 엔티티가 Flyway 로 만든 스키마와 맞는지 부팅할 때 확인한다. 어긋나면 앱이 뜨지 않는다.
#
# **이건 스키마를 만드는 설정이 아니다.** create/update 는 금지고(스키마 소유권은 Flyway 단일),
# validate 는 반대로 "Flyway 가 만든 것과 다르면 거부한다"는 뜻이라 그 규칙을 지키는 쪽이다.
#
# 없으면 기본값이 none 이다 — Testcontainers Postgres 는 임베디드가 아니라 Boot 이 켜 주지
# 않는다. 그 상태에서는 컬럼명을 틀려도 컨텍스트가 뜨고, 그 행을 실제로 읽고 쓸 때 터진다.
# 즉 contextLoads() 가 매핑을 검증한다는 말이 성립하려면 이 줄이 있어야 한다.
spring.jpa.hibernate.ddl-auto=validate

# ─── 호출자 인증 ─────────────────────────────────────────────────────────
# 이 서버는 owner_key 를 그대로 믿고 소유자를 판단한다. 그 값을 지어낼 수 있으면 남의
# 이력·면접 기록을 읽을 수 있으므로, /api/** 는 owner_key 에 붙은 HMAC 서명을 요구한다.
#
# **jobit-front 의 JOBIT_SERVICE_SECRET 과 같은 값이어야 한다.** 한쪽만 설정하면
# 프론트가 서명 없이 불러 401 이 나거나, 서버가 검증하지 않는다.
#
# 비우면 인증이 꺼진다 — 로컬에서 설정 없이 돌려 보기 위한 것이다. 대신 부팅 로그에 경고가
# 남고, prod 프로파일에서는 비어 있으면 앱이 뜨지 않는다.
#   openssl rand -base64 32
jobit.auth.service-secret=${JOBIT_SERVICE_SECRET:}

# ─── 이력서 (스펙 §3.3, §6) ──────────────────────────────────────────────
# 이력서 원문(raw_text)을 AES-256-GCM 으로 암호화하는 키. base64 32바이트.
#
# **비어 있으면 이력서 업로드가 거부된다.** 호출자 인증과 달리 "꺼진 채로 동작"을 두지 않았다 —
# 인증이 꺼진 것은 로그를 보면 알지만, 평문으로 저장된 이력서는 나중에 되돌릴 수 없다.
# prod 프로파일에서는 비어 있으면 앱이 아예 뜨지 않는다.
#   openssl rand -base64 32
jobit.resume.encryption-key=${JOBIT_RESUME_KEY:}

# 이력서 보관 기간. 지나면 문장·벡터까지 통째로 지운다 (ResumeCleanup).
# 면접 발화 원문과 같은 90일이다 — 둘 다 사용자가 자기 경력을 적은 내용이라 다르게 볼 이유가 없다.
jobit.resume.ttl-days=90

# ─── LLM (Ollama) ────────────────────────────────────────────────────────
# **ollama.base-url 은 여기 두지 않는다.** .env 에 적는다 (.env.example 참고).
#
# 여기에 `ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}` 처럼 기본값을 박으면
# 프로퍼티가 **항상 있는 것**이 되어 @ConditionalOnProperty 가 늘 통과한다. 그러면
# JdParserFallbackConfig / AnswerScorerFallbackConfig / EmbeddingClientFallbackConfig 이
# 영영 물리지 않고, "LLM 설정 없이도 앱은 뜬다"는 성질이 조용히 사라진다.
# (anthropic.api-key 시절의 "빈 문자열도 있음으로 판정된다"와 같은 함정이다.)

# 컨텍스트 창. **기본값에 기대지 않는다.**
# Ollama 의 기본 컨텍스트는 모델 최대치가 아니라 훨씬 작고, 넘치면 에러가 아니라
# **입력 앞부분이 조용히 잘린다.** 긴 공고나 이력서에서 앞쪽이 사라진 채 그럴듯한 결과가
# 나오는 것이 그 결과이고, 사후에 알아채기 가장 어려운 실패다.
#
# 입력과 출력이 이 값을 나눠 쓴다: `입력 예상치 + LlmModelConfig 의 maxTokens < num-ctx`.
# 지금 가장 큰 maxTokens 가 8,000 이라 입력에 8,000 토큰이 남는다.
# 올리면 KV 캐시가 그만큼 메모리를 먹는다 — 18GB 에서 qwen3:14b 와 함께면 16384 가 무난하다.
jobit.llm.ollama.num-ctx=16384

# 임베딩 모델. **resume_bullet.embedding 의 vector(n) 과 차원이 같아야 한다** (Flyway V11).
# 바꾸려면 마이그레이션이 먼저고, 기존 벡터는 변환할 수 없어 재업로드가 따라온다.
jobit.llm.ollama.embedding-model=qwen3-embedding:0.6b
jobit.llm.ollama.embedding-dimensions=1024

# ─── LLM 자원 방어 (스펙 §6) ─────────────────────────────────────────────
# **막는 대상이 돈에서 시간으로 바뀌었다.** 로컬 추론에는 토큰 요금이 없다. 대신 GPU 가
# 하나뿐이라, 폭주하는 요청 하나가 다른 모든 요청을 줄 세운다 — 사용자가 겪는 피해는
# 청구서가 아니라 대기 시간이다.
#
# 그래서 소유자별 시간당 한도는 그대로 둔다. 캐시 적중은 여전히 소비하지 않는다.
jobit.llm.calls-per-hour=20

# 전역 일일 비용 상한. **0 이면 꺼진다.**
# LlmPricing 이 로컬 모델을 전부 0 원으로 계산하므로 이 방어는 어차피 발동하지 않는다.
# 스위치와 계산이 둘 다 0 을 가리키게 두어 "왜 안 걸리지"를 한 번에 알 수 있게 했다.
# 유료 제공자를 다시 붙이면 LlmPricing 의 단가와 함께 여기도 되살린다.
jobit.llm.daily-budget-usd=0

# ─── 면접 연습 (docs/interview-practice-design.md §6) ─────────────────────
# **이 기능만 비용 구조가 다르다.** 다른 기능은 요청 1건 = LLM 1회지만 면접 연습은
# 세션 1건 = 문항 수만큼이다. 위의 calls-per-hour 만으로 막으면 세션 네 번에 소진되어
# 공고 분석까지 함께 막힌다. 그래서 세션 수에 별도 상한을 둔다.
#
# calls-per-hour 를 올려서 해결하지 않는다 — 올리면 파싱·질문 생성 쪽 방어까지 헐거워진다.
#
# sessions-per-day=6 은 유료 시절 비용 실측으로 정한 값인데, 로컬 전환 후에도 유지한다 —
# 이제 막는 것이 돈이 아니라 GPU 시간이고, 세션 하나가 문항 수만큼 추론을 먹는 것은 같다.
# 0 으로 두면 끈다 (로컬 개발용).
jobit.interview.questions-per-session=5
jobit.interview.sessions-per-day=6
jobit.interview.time-limit-sec=90
# 발화 원문 보관 기간. 만료되면 transcript 만 지우고 점수·피드백은 남긴다 (설계 문서 §7).
jobit.interview.transcript-ttl-days=90
