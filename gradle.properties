# 데몬 재사용을 위해 JVM 인자를 고정한다.
# 이 값이 없으면 호출 주체(터미널·IDE)마다 기본값이 달라져 "incompatible Daemon"으로
# 재사용에 실패하고, 실제 할 일이 없어도 데몬을 새로 띄우느라 매번 몇 초를 쓴다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# 태스크 그래프를 캐시해 재실행 시 구성 단계를 건너뛴다.
org.gradle.configuration-cache=true

# 태스크 출력 캐시. 되돌린 변경을 다시 컴파일하지 않는다.
org.gradle.caching=true

# 서로 의존하지 않는 태스크를 동시에 실행한다.
org.gradle.parallel=true
